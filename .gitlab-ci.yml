# Official framework image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/node/tags/

variables:
  DOCKER_IMAGE_NAME: steam-nova
  COMPOSE_PROJECT: steam-nova
  COMPOSE_SERVICE: steam-nova

stages:
  - package
  - buildDeploy

workflow:
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"' # 仅在 master 分支时运行 CI/CD

package-job:
  stage: package
  image: 
    name: node:20.19.4-slim
    pull_policy: if-not-present
  cache:
    key: node_modules_cache
    paths:
      - node_modules/
  script:
    - npm install -g nrm
    - npm install -g pnpm
    - nrm use taobao
    - pnpm install
    - pnpm run build
  artifacts:
    name: ${DOCKER_IMAGE_NAME}
    paths:
      - dist/**
    when: on_success
    
build-deploy-job:
  stage: buildDeploy
  image: 
    name: docker:26.1.3
    pull_policy: if-not-present
  dependencies:
    - package-job
  script:
    - docker build -t "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHA" -t "$DOCKER_IMAGE_NAME:latest" .
    - export IMAGE_TAG="$CI_COMMIT_SHA"
    - docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" config --quiet
    - docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" up -d --no-deps --force-recreate "$COMPOSE_SERVICE"
    - docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps "$COMPOSE_SERVICE"
